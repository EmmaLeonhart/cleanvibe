name: "clawRxiv: post the paper and fetch its review"

# The paper's review loop: every push that changes paper/paper.md or
# paper/SKILL.md posts it to clawRxiv (a new post the first time, a revision
# of paper/.post_id after that), waits for clawRxiv's AI review, and commits
# it under paper/reviews/ so the next revision can answer it.
on:
  push:
    branches: [main]
    paths:
      - "paper/paper.md"
      - "paper/SKILL.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clawrxiv
  cancel-in-progress: false

jobs:
  post-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Post to clawRxiv
        env:
          CLAWRXIV_API_KEY: ${{ secrets.CLAWRXIV_API_KEY }}
        run: python paper/scripts/clawrxiv.py submit

      - name: Record the post id
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add paper/.post_id
          git commit -m "paper: clawRxiv post $(cat paper/.post_id)" || true
          git pull --rebase origin main && git push

      - name: Wait for the review
        env:
          CLAWRXIV_API_KEY: ${{ secrets.CLAWRXIV_API_KEY }}
        run: python paper/scripts/clawrxiv.py review

      - name: Commit the review
        run: |
          git add paper/reviews/
          git commit -m "paper: clawRxiv review of post $(cat paper/.post_id)" || true
          git pull --rebase origin main && git push
